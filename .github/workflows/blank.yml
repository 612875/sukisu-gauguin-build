name: Build Kernel for Redmi Note 9 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Install Python 2
      run: |
        sudo apt update
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
    - name: Checkout kernel source
      run: |
        git clone --depth=1 -b gauguin-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
        cd kernel
        make ARCH=arm64 gauguin_defconfig
        
    - name: Setup SukiSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        scripts/config --enable KALLSYMS
        scripts/config --enable KALLSYMS_ALL
        
    - name: Build
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        sudo apt install -y gcc-aarch64-linux-gnu
        make -j$(nproc)
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: kernel/arch/arm64/boot/Image.gz-dtb
