name: Build Kernel for Redmi Note 9 Pro (gauguin)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          flex bison libssl-dev bc \
          git curl ca-certificates

    - name: Set Python 2 as default
      run: |
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        python --version  # 验证

    - name: Checkout Kernel Source
      run: |
        git clone --depth=1 -b gauguin-q-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

    - name: Setup SukiSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        
    - name: Configure Kernel
      run: |
        cd kernel
        make ARCH=arm64 gauguin_defconfi
